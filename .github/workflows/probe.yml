name: restricted-probes
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
      commit:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Attempt unauthorised synthetic operations
        env:
          GH_TOKEN: ${{ github.token }}
          SYNTHETIC_PR: ${{ inputs.pr }}
          SYNTHETIC_COMMIT: ${{ inputs.commit }}
        run: python3 probe_permissions.py
